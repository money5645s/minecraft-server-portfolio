<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060908">
  <title>건축 아카이브 | CHOROK Studio</title>
  <style>
    :root { --ink: #f4f6f3; --muted: #aab5ad; --green: #b9f874; --line: rgba(185,248,116,.24); --black: #060908; }
    * { box-sizing: border-box; }
    html { background: var(--black); scroll-behavior: smooth; }
    body { min-width: 320px; margin: 0; background: radial-gradient(circle at 50% -20%, rgba(255,255,255,.15), transparent 40%), var(--black); color: var(--ink); font-family: Inter, Pretendard, "Noto Sans KR", Arial, sans-serif; user-select: none; -webkit-user-select: none; }
    a { color: inherit; text-decoration: none; }
    .topbar { position: fixed; z-index: 5; inset: 0 0 auto; height: 82px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(22px, 4vw, 64px); border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(6,9,8,.72); backdrop-filter: blur(16px); user-select: none; -webkit-user-select: none; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 900; font-size: .9rem; letter-spacing: .05em; }
    .brand-mark { width: 36px; height: 36px; overflow: hidden; border: 1px solid rgba(185,248,116,.65); border-radius: 9px; background: #fff; }
    .brand-mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .back-link { display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px; border: 1px solid var(--line); color: var(--green); font-size: .76rem; font-weight: 900; transition: background .2s ease, color .2s ease; }
    .back-link:hover { background: var(--green); color: #081008; }
    main { position: relative; height: 100svh; overflow: hidden; padding-top: 82px; }
    .gallery-title { position: fixed; z-index: 6; top: 41px; left: 50%; margin: 0; color: var(--ink); font-size: clamp(1.1rem, 1.8vw, 1.7rem); font-weight: 900; letter-spacing: -.06em; text-align: center; text-shadow: 0 2px 18px rgba(0,0,0,.72); pointer-events: none; user-select: none; -webkit-user-select: none; transform: translate(-50%, -50%); }
    .gallery-wrap { height: calc(100svh - 82px); overflow: hidden; cursor: none; user-select: none; touch-action: pan-y; }
    .gallery-wrap.dragging { cursor: none; }
    .gallery { display: flex; gap: clamp(12px, 1.6vw, 24px); width: max-content; height: 100%; padding: 54px 6vw; will-change: transform; }
    .gallery-set { display: flex; flex: none; gap: clamp(12px, 1.6vw, 24px); height: 100%; }
    .build-card { flex: 0 0 calc((100vw - 12vw - 24px) / 1.5); width: calc((100vw - 12vw - 24px) / 1.5); height: calc(100% - 108px); margin: 0; overflow: hidden; background: #111; cursor: none; }
    .gallery-set.is-primary .build-card:nth-child(-n + 3) { opacity: 0; transform: translateY(24px) scale(.98); }
    body.gallery-ready .gallery-set.is-primary .build-card:nth-child(-n + 3) { animation: gallery-reveal 1.2s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--reveal-order) * 240ms); }
    .build-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; transition: transform .55s cubic-bezier(.2,.8,.2,1), filter .45s ease; }
    .build-card:hover img { filter: saturate(1.08); transform: scale(1.025); }
    .progress { position: absolute; z-index: 2; right: clamp(46px, 12vw, 200px); bottom: 38px; left: clamp(46px, 12vw, 200px); height: 1px; overflow: visible; background: rgba(255,255,255,.2); pointer-events: none; opacity: 0; transform: translateY(18px); }
    body.gallery-ready .progress { animation: progress-reveal .42s cubic-bezier(.16,1,.3,1) .56s both; }
    .progress-bar { position: absolute; top: -2px; left: 0; width: min(288px, 72%); height: 5px; border-radius: 999px; background: var(--green); box-shadow: 0 0 12px rgba(185,248,116,.55); }
    .scroll-hint { position: fixed; z-index: 4; bottom: 64px; left: 50%; margin: 0; color: rgba(201,209,203,.68); font-size: .88rem; font-weight: 800; letter-spacing: .08em; pointer-events: none; opacity: 0; transform: translate(-50%, 7px); transition: opacity .35s ease, transform .35s ease; }
    .scroll-hint.visible { opacity: 1; transform: translate(-50%, 0); }
    .direction-hint { position: fixed; z-index: 4; top: 50%; display: flex; justify-content: space-between; width: 100%; padding: 0 28px; color: rgba(231,238,233,.62); font-size: 2.4rem; font-weight: 300; line-height: 1; pointer-events: none; opacity: 0; transform: translateY(-50%); transition: opacity .35s ease; }
    .direction-hint.visible { opacity: 1; }
    .cursor-preview { position: fixed; z-index: 15; display: grid; width: 104px; height: 104px; place-items: center; border: 1px solid rgba(255,255,255,.76); border-radius: 50%; background: rgba(255,255,255,.13); color: rgba(255,255,255,.8); font-size: .73rem; font-weight: 800; letter-spacing: -.04em; text-align: center; backdrop-filter: blur(5px); pointer-events: none; user-select: none; -webkit-user-select: none; opacity: 0; transform: translate3d(-50%, -50%, 0) scale(.76); transition: opacity .18s ease, transform .18s ease; }
    .cursor-preview.visible { opacity: 1; transform: translate3d(-50%, -50%, 0) scale(1); }
    .lightbox { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; padding: 0; border: 0; background: rgba(2,4,3,.94); cursor: zoom-out; }
    .lightbox:not([open]) { display: none; }
    .lightbox::backdrop { background: rgba(2,4,3,.94); }
    .lightbox img { max-width: min(94vw, 1900px); max-height: 94svh; object-fit: contain; pointer-events: none; }
    .lightbox[open] { animation: lightbox-fade .24s ease-out; }
    .lightbox[open] img { animation: image-expand .5s cubic-bezier(.16,1,.3,1); }
    .lightbox-close { position: absolute; top: 22px; right: 24px; width: 42px; height: 42px; border: 1px solid rgba(255,255,255,.4); background: rgba(5,8,6,.55); color: var(--ink); font-size: 1.45rem; cursor: pointer; }
    .lightbox-credit { position: absolute; right: 28px; bottom: 26px; margin: 0; color: rgba(255,255,255,.78); font-size: 1rem; font-weight: 900; letter-spacing: .13em; }
    @keyframes lightbox-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes image-expand { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: scale(1); } }
    @keyframes gallery-reveal { from { opacity: 0; transform: translateY(24px) scale(.98); filter: brightness(.36); } to { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); } }
    @keyframes progress-reveal { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .lightbox[open], .lightbox[open] img { animation: none; } .gallery-set.is-primary .build-card:nth-child(-n + 3) { opacity: 1; transform: none; } body.gallery-ready .gallery-set.is-primary .build-card:nth-child(-n + 3), body.gallery-ready .progress { animation: none; opacity: 1; transform: none; } }
    @media (max-width: 640px) { .topbar { height: 70px; } main { padding-top: 70px; } .gallery-wrap { height: calc(100svh - 70px); cursor: grab; } .gallery-title { top: 35px; } .gallery, .gallery-set { gap: 10px; } .gallery { padding: 48px 10vw; } .build-card { flex-basis: 80vw; width: 80vw; height: calc(100% - 96px); cursor: grab; } .progress { right: 36px; bottom: 30px; left: 36px; } .scroll-hint { bottom: 53px; font-size: .66rem; } .direction-hint { padding: 0 17px; font-size: 1.35rem; } .cursor-preview { display: none; } .lightbox-close { top: 13px; right: 13px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="portfolio.html#services" aria-label="포트폴리오로 돌아가기"><span class="brand-mark"><img src="assets/chorok-studio-logo.png" alt=""></span><span>CHOROK STUDIO</span></a>
    <a class="back-link" href="portfolio.html#services">← 포트폴리오</a>
  </header>
  <main>
    <h1 class="gallery-title">갤러리</h1>
    <div class="gallery-wrap" id="galleryWrap" tabindex="0" aria-label="건축 작업물 갤러리. 드래그, 휠 또는 방향키로 이동하고 이미지를 클릭하면 확대됩니다">
      <div class="gallery" id="gallery">
        <figure class="build-card"><img src="assets/worlds/a1.jfif" alt="공중 섬 위의 성 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a2.jfif" alt="숲속 성 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a3.jfif" alt="산속 전통 마을 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a4.jfif" alt="대형 도서관 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a5.jfif" alt="가을 성채 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a7.jfif" alt="석양의 도시 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a8.jfif" alt="흰 성 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a12.jfif" alt="바다 위 대성당 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a14.jfif" alt="우주 함선 건축"></figure>
        <figure class="build-card"><img src="assets/worlds/a16.jfif" alt="오로라 성 건축"></figure>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
    <p class="scroll-hint" id="scrollHint" aria-hidden="true">스크롤 해서 넘기기</p>
    <div class="direction-hint" id="directionHint" aria-hidden="true"><span>‹</span><span>›</span></div>
  </main>
  <dialog class="lightbox" id="lightbox" aria-label="확대된 건축 이미지"><img id="lightboxImage" alt=""><p class="lightbox-credit">건축가 : 레딕</p><button class="lightbox-close" type="button" aria-label="확대 이미지 닫기">×</button></dialog>
  <div class="cursor-preview" id="cursorPreview" aria-hidden="true">크게 보기</div>
  <script>
    const wrap = document.getElementById("galleryWrap");
    const gallery = document.getElementById("gallery");
    const progressBar = document.getElementById("progressBar");
    const cursorPreview = document.getElementById("cursorPreview");
    const scrollHint = document.getElementById("scrollHint");
    const directionHint = document.getElementById("directionHint");
    const sourceCards = [...gallery.querySelectorAll(".build-card")];
    const makeGallerySet = (isPrimary = false) => {
      const set = document.createElement("div");
      set.className = `gallery-set${isPrimary ? " is-primary" : ""}`;
      sourceCards.forEach((card) => set.append(card.cloneNode(true)));
      return set;
    };
    const previousSet = makeGallerySet();
    const primarySet = makeGallerySet(true);
    const nextSet = makeGallerySet();
    gallery.replaceChildren(previousSet, primarySet, nextSet);
    const cards = [...primarySet.querySelectorAll(".build-card")];
    cards.forEach((card, index) => card.style.setProperty("--reveal-order", index));
    let translate = 0;
    let groupStride = 0;
    let loopBase = 0;
    let dragging = false;
    let dragDistance = 0;
    let pressedImage = null;
    let lastPointerX = 0;
    let lastPointerTime = 0;
    let velocity = 0;
    let inertiaFrame = 0;
    let hintTimer = 0;
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const getGroupStride = () => primarySet.getBoundingClientRect().width + (Number.parseFloat(getComputedStyle(gallery).gap) || 0);
    const getLoopBase = () => {
      const leftPadding = Number.parseFloat(getComputedStyle(gallery).paddingLeft) || 0;
      const cardWidth = cards[0]?.getBoundingClientRect().width || 0;
      return groupStride + leftPadding - (window.innerWidth - cardWidth) / 2;
    };
    const normalizeTranslate = () => {
      if (!groupStride) return;
      while (translate < loopBase - groupStride) translate += groupStride;
      while (translate >= loopBase + groupStride) translate -= groupStride;
    };
    const render = () => {
      gallery.style.transform = `translate3d(${-translate}px, 0, 0)`;
      const progress = groupStride ? ((translate - loopBase + groupStride) % groupStride) / groupStride : 0;
      const markerTravel = Math.max(0, progressBar.parentElement.clientWidth - progressBar.offsetWidth);
      progressBar.style.transform = `translateX(${progress * markerTravel}px)`;
    };
    const hideScrollHint = () => {
      window.clearTimeout(hintTimer);
      scrollHint.classList.remove("visible");
      directionHint.classList.remove("visible");
    };
    const showScrollHintWhenIdle = (delay = 900) => {
      window.clearTimeout(hintTimer);
      hintTimer = window.setTimeout(() => {
        scrollHint.classList.add("visible");
        directionHint.classList.add("visible");
      }, delay);
    };
    const moveCursor = (event) => {
      if (event.pointerType !== "mouse" || !event.target.closest(".build-card")) {
        cursorPreview.classList.remove("visible");
        return;
      }
      cursorPreview.style.left = `${event.clientX}px`;
      cursorPreview.style.top = `${event.clientY}px`;
      cursorPreview.classList.add("visible");
    };
    const stopInertia = () => window.cancelAnimationFrame(inertiaFrame);
    const startInertia = () => {
      stopInertia();
      const animate = () => {
        translate += velocity;
        normalizeTranslate();
        velocity *= .94;
        render();
        if (Math.abs(velocity) > .12) inertiaFrame = window.requestAnimationFrame(animate);
        else {
          velocity = 0;
          showScrollHintWhenIdle();
        }
      };
      inertiaFrame = window.requestAnimationFrame(animate);
    };
    const start = (event) => {
      stopInertia();
      hideScrollHint();
      dragging = true;
      dragDistance = 0;
      pressedImage = event.target.closest(".build-card")?.querySelector("img") || null;
      velocity = 0;
      lastPointerX = event.clientX;
      lastPointerTime = performance.now();
      wrap.classList.add("dragging");
      wrap.setPointerCapture?.(event.pointerId);
    };
    const move = (event) => {
      if (!dragging) return;
      const now = performance.now();
      const delta = event.clientX - lastPointerX;
      const elapsed = Math.max(1, now - lastPointerTime);
      translate -= delta;
      normalizeTranslate();
      velocity = (-delta / elapsed) * 16.67;
      dragDistance += Math.abs(delta);
      lastPointerX = event.clientX;
      lastPointerTime = now;
      render();
    };
    const openLightbox = (image) => {
      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      cursorPreview.classList.remove("visible");
      lightbox.showModal();
    };
    const end = (event) => {
      if (!dragging) return;
      dragging = false;
      wrap.classList.remove("dragging");
      if (event.type === "pointerup" && dragDistance <= 8 && pressedImage) openLightbox(pressedImage);
      else if (Math.abs(velocity) > .3) startInertia();
      else showScrollHintWhenIdle();
      pressedImage = null;
    };
    wrap.addEventListener("pointerdown", start);
    wrap.addEventListener("pointermove", move);
    wrap.addEventListener("pointermove", moveCursor);
    wrap.addEventListener("pointerup", end);
    wrap.addEventListener("pointercancel", end);
    wrap.addEventListener("pointerleave", () => cursorPreview.classList.remove("visible"));
    wrap.addEventListener("wheel", (event) => {
      if (!event.deltaY && !event.deltaX) return;
      event.preventDefault();
      stopInertia();
      hideScrollHint();
      translate += event.deltaY + event.deltaX;
      normalizeTranslate();
      render();
      showScrollHintWhenIdle();
    }, { passive: false });
    wrap.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      stopInertia();
      hideScrollHint();
      translate += event.key === "ArrowRight" ? 180 : -180;
      normalizeTranslate();
      render();
      showScrollHintWhenIdle();
    });
    lightbox.addEventListener("click", (event) => { if (event.target === lightbox) lightbox.close(); });
    lightbox.querySelector("button").addEventListener("click", () => lightbox.close());
    lightbox.addEventListener("close", () => showScrollHintWhenIdle());
    window.addEventListener("resize", () => {
      const cyclePosition = groupStride ? (translate - loopBase) / groupStride : 0;
      groupStride = getGroupStride();
      loopBase = getLoopBase();
      translate = loopBase + cyclePosition * groupStride;
      normalizeTranslate();
      render();
    });
    window.addEventListener("load", () => window.requestAnimationFrame(() => {
      document.body.classList.add("gallery-ready");
      showScrollHintWhenIdle(1900);
    }));
    groupStride = getGroupStride();
    loopBase = getLoopBase();
    translate = loopBase;
    render();
  </script>
</body>
</html>
